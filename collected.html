<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스레드 데이터 보드 - SNS Metric Dashboard</title>
  <link rel="stylesheet" href="styles/dashboard.css">
  <link rel="stylesheet" href="styles/content.css">
</head>
<body>

  <div class="app-container">
    <!-- Left Navigation Sidebar (Photo 1) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>관리자 모드</span>
      </div>

      <div class="sidebar-view-toggle">
        <button class="view-toggle-btn active">관리자 보기</button>
        <button class="view-toggle-btn">일반 보기</button>
      </div>

      <!-- Navigation Section 1: 탐색 -->
      <div class="nav-section">
        <div class="nav-title">탐색</div>
        <a href="#" class="nav-item">🔥 실시간 키워드</a>
        <a href="#" class="nav-item">📈 트렌드 데이터</a>
        <a href="#" class="nav-item">🛒 쇼핑 베스트</a>
        <a href="#" class="nav-item">📦 상품 보드</a>
      </div>

      <!-- Navigation Section 2: 발행 -->
      <div class="nav-section">
        <div class="nav-title">발행</div>
        <a href="#" class="nav-item active">📢 스레드</a>
      </div>

      <!-- Navigation Section 3: 수익·성장 -->
      <div class="nav-section">
        <div class="nav-title">수익·성장</div>
        <a href="#" class="nav-item">📊 수익 실적</a>
        <a href="#" class="nav-item">🏆 챌린지</a>
        <a href="#" class="nav-item">💎 랭킹</a>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Navbar (Photo 1) -->
      <header class="top-navbar">
        <div class="top-search-bar">
          <span>🔍</span>
          <input type="text" placeholder="스레드 피드 검색..." id="top-search-input">
        </div>

        <div class="top-user-menu">
          <div class="credit-badge">⚡ 1,397 크레딧</div>
          <button class="quick-start-btn">📖 1초만에 시작하기</button>
          <div class="avatar">Me</div>
        </div>
      </header>

      <!-- Main Content Body (Photo 1) -->
      <main class="content-body">
        <!-- Status Tabs Row -->
        <div class="tabs-row">
          <div class="status-tabs">
            <button class="tab-btn active" data-status="all">전체 <span class="badge-count" id="count-all">0</span></button>
            <button class="tab-btn" data-status="collected">수집 <span class="badge-count" id="count-collected">0</span></button>
            <button class="tab-btn" data-status="analyzed">분석 <span class="badge-count" id="count-analyzed">0</span></button>
            <button class="tab-btn" data-status="editing">편집 <span class="badge-count" id="count-editing">1</span></button>
            <button class="tab-btn" data-status="failed">발행 실패 <span class="badge-count" id="count-failed">0</span></button>
            <button class="tab-btn" data-status="reserved">예약 <span class="badge-count" id="count-reserved">0</span></button>
            <button class="tab-btn" data-status="uploaded">업로드 <span class="badge-count" id="count-uploaded">0</span></button>
          </div>

          <button class="action-collect-btn" id="btn-create-post" style="background: linear-gradient(135deg, #f97316, #ea580c); margin-right: 8px;">✏️ 새 글 작성</button>
          <button class="action-collect-btn" id="btn-goto-collect">수집하러 가기 ✨</button>
        </div>

        <!-- Filter Controls Row -->
        <div class="filter-controls">
          <div class="search-filter-group">
            <input type="text" class="input-search" id="filter-keyword" placeholder="제목·본문·작성자 검색">
            <select class="select-filter" id="filter-category">
              <option value="all">전체 카테고리</option>
              <option value="shopping">🛒 쿠팡 / 쇼핑</option>
              <option value="sns">📢 스레드 / SNS</option>
              <option value="trend">🔥 트렌드</option>
              <option value="general">💬 자유게시판</option>
            </select>
            <select class="select-filter" id="filter-grade">
              <option value="all">전체 등급</option>
              <option value="super">강력 / 폭발 (>=8배)</option>
              <option value="medium">흥행 / 우수 (>=3배)</option>
              <option value="normal">보통 / 약함 (&lt;3배)</option>
            </select>
          </div>

          <div class="layout-toggle-group">
            <span class="item-count-text" id="total-item-count">0개</span>
            <div class="toggle-pill-group">
              <button class="toggle-pill-btn" id="btn-grid-mode">그리드 뷰</button>
              <button class="toggle-pill-btn active" id="btn-list-mode">리스트 뷰</button>
            </div>
          </div>
        </div>

        <!-- Data Table Container (List View) -->
        <div class="table-card-container" id="list-container">
          <table class="data-table" id="dashboard-table">
            <thead>
              <tr>
                <th style="width: 40px;"><input type="checkbox" id="check-all"></th>
                <th style="width: 40px;">#</th>
                <th>게시글/상품 - 작성일 ↕</th>
                <th>카테고리 ↕</th>
                <th>조회수 ↕</th>
                <th>좋아요 ↕</th>
                <th>상태 ↕</th>
                <th>수집/작성일 ↕</th>
                <th style="text-align: right;">작업</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <!-- Dynamically rendered rows -->
            </tbody>
          </table>
        </div>

        <!-- Grid Container (Grid View) -->
        <div id="grid-container" style="display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 16px;">
          <!-- Dynamically rendered cards -->
        </div>

      </main>
    </div>
  </div>

  <!-- Modal 1: Create Post Modal -->
  <div id="modal-create-post" class="db-modal-overlay" style="display: none;">
    <div class="db-action-modal" style="max-width: 520px; text-align: left;">
      <div class="db-modal-title" style="font-size: 18px; margin-bottom: 16px;">✏️ Cloudflare 게시판 - 새 글 작성</div>
      
      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; font-weight: 700; color: #a5b4fc; display: block; margin-bottom: 4px;">카테고리</label>
        <select id="post-input-category" style="width: 100%; padding: 10px; background: #1e1e2e; border: 1px solid #313244; color: #fff; border-radius: 8px;">
          <option value="general">💬 자유게시판</option>
          <option value="shopping">🛒 쿠팡 / 쇼핑</option>
          <option value="sns">📢 스레드 / SNS</option>
          <option value="trend">🔥 트렌드</option>
        </select>
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; font-weight: 700; color: #a5b4fc; display: block; margin-bottom: 4px;">게시글 제목</label>
        <input type="text" id="post-input-title" placeholder="제목을 입력하세요" style="width: 100%; padding: 10px; background: #1e1e2e; border: 1px solid #313244; color: #fff; border-radius: 8px;">
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; font-weight: 700; color: #a5b4fc; display: block; margin-bottom: 4px;">작성자</label>
        <input type="text" id="post-input-author" placeholder="작성자 이름" style="width: 100%; padding: 10px; background: #1e1e2e; border: 1px solid #313244; color: #fff; border-radius: 8px;">
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; font-weight: 700; color: #a5b4fc; display: block; margin-bottom: 4px;">본문 내용</label>
        <textarea id="post-input-content" rows="4" placeholder="내용을 입력하세요..." style="width: 100%; padding: 10px; background: #1e1e2e; border: 1px solid #313244; color: #fff; border-radius: 8px; font-family: inherit; resize: vertical;"></textarea>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="font-size: 12px; font-weight: 700; color: #a5b4fc; display: block; margin-bottom: 4px;">관련 링크 (선택)</label>
        <input type="text" id="post-input-link" placeholder="https://..." style="width: 100%; padding: 10px; background: #1e1e2e; border: 1px solid #313244; color: #fff; border-radius: 8px;">
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button id="btn-cancel-create" class="db-modal-btn btn-purple" style="width: 100px;">취소</button>
        <button id="btn-submit-create" class="db-modal-btn btn-gradient" style="width: 120px;">작성 완료 ✨</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: View Post Detail Modal -->
  <div id="modal-view-post" class="db-modal-overlay" style="display: none;">
    <div class="db-action-modal" style="max-width: 600px; text-align: left;">
      <div id="view-post-category" style="display: inline-block; font-size: 11px; padding: 4px 10px; background: rgba(124, 58, 237, 0.2); color: #c4b5fd; border-radius: 20px; margin-bottom: 8px; font-weight: 700;">카테고리</div>
      <div id="view-post-title" style="font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 8px;">제목</div>
      <div style="font-size: 12px; color: #94a3b8; margin-bottom: 16px;">
        작성자: <span id="view-post-author" style="color: #e2e8f0; font-weight: 600;">-</span> | 작성일: <span id="view-post-date">-</span>
      </div>
      
      <div id="view-post-content" style="background: #181824; border: 1px solid #2e2e3e; padding: 16px; border-radius: 12px; font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap;">
        본문 내용
      </div>

      <div id="view-post-images" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;">
        <!-- Images injected -->
      </div>

      <div style="display: flex; gap: 10px; justify-content: space-between; align-items: center;">
        <a id="view-post-link" href="#" target="_blank" style="font-size: 13px; color: #818cf8; font-weight: 700; text-decoration: none; white-space: nowrap;">🔗 원본 링크 보기</a>
        <div style="display: flex; gap: 8px;">
          <button id="btn-create-blog-modal" class="db-modal-btn btn-gradient" style="padding: 8px 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 0;">✍️ 블로그 글 생성</button>
          <button id="btn-delete-post" class="db-modal-btn btn-red" style="width: 80px; padding: 8px 12px; margin-bottom: 0;">삭제</button>
          <button id="btn-close-view" class="db-modal-btn btn-purple" style="width: 80px; padding: 8px 12px; margin-bottom: 0;">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal 3: Blog & Threads Post Generation Modal -->
  <div id="modal-blog-generation" class="db-modal-overlay" style="display: none;">
    <div class="db-action-modal" style="max-width: 800px; text-align: left; width: 95%; height: 92vh; display: flex; flex-direction: column;">
      <div class="db-modal-title" style="font-size: 18px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
        <span>✍️ AI 마케팅 원고 생성기</span>
        <button id="btn-close-blog" style="background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer;">✕</button>
      </div>

      <!-- Tab Navigation -->
      <div style="display: flex; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid #31324f; padding-bottom: 10px;">
        <button id="tab-blog-mode" class="db-modal-btn btn-purple" style="flex: 1; margin-bottom: 0; font-weight: 700; background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);">✍️ 블로그 원고</button>
        <button id="tab-threads-mode" class="db-modal-btn" style="flex: 1; margin-bottom: 0; font-weight: 700; background: #1e1e2f; color: #94a3b8; border: 1px solid #31324f;">📢 스레드 원고</button>
      </div>

      <!-- Shared Configuration Panel -->
      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;">
        <!-- API Key Settings Section -->
        <div id="blog-api-key-container" style="background: #1e1e2f; border: 1px solid #31324f; padding: 10px; border-radius: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between;">
          <div style="flex: 1;">
            <label style="font-size: 10px; font-weight: 700; color: #a5b4fc; display: block; margin-bottom: 2px;">Google Gemini API Key</label>
            <input type="password" id="gemini-api-key-input" placeholder="AI Studio에서 무료로 발급받은 API 키를 입력하세요" style="width: 100%; padding: 6px 8px; background: #12121e; border: 1px solid #313244; color: #fff; border-radius: 6px; font-size: 11px;">
          </div>
          <div style="margin-top: 12px;">
            <a href="https://aistudio.google.com/" target="_blank" style="font-size: 10px; color: #818cf8; text-decoration: underline; margin-right: 8px;">키 발급 ➔</a>
            <button id="btn-save-api-key" class="db-modal-btn btn-purple" style="padding: 4px 10px; font-size: 10px; width: auto; margin-bottom: 0;">저장</button>
          </div>
        </div>

        <!-- Coupang Partners Link Input -->
        <div style="background: #1e1e2f; border: 1px solid #31324f; padding: 10px; border-radius: 10px;">
          <label style="font-size: 10px; font-weight: 700; color: #a5b4fc; display: block; margin-bottom: 2px;">🔗 개인 제휴 링크 (비워두면 상품 원본 링크가 사용됩니다)</label>
          <input type="text" id="coupang-partners-link-input" placeholder="예: https://link.coupang.com/a/xxxxxx 또는 네이버 쇼핑커넥트 주소" style="width: 100%; padding: 6px 8px; background: #12121e; border: 1px solid #313244; color: #fff; border-radius: 6px; font-size: 11px;">
        </div>
      </div>

      <!-- Generation status -->
      <div id="blog-status-message" style="display: none; padding: 10px; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 8px; color: #93c5fd; font-size: 12px; margin-bottom: 12px; text-align: center;">
        🤖 AI 분석 및 작성을 진행 중입니다... (약 5~10초 소요)
      </div>

      <!-- BLOG VIEW CONTAINER -->
      <div id="container-blog-view" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; gap: 8px; align-items: center;">
          <label style="font-size: 11px; font-weight: 700; color: #a5b4fc;">작성 스타일:</label>
          <select id="blog-style-select" style="flex: 1; padding: 8px; background: #1e1e2e; border: 1px solid #313244; color: #fff; border-radius: 6px; font-size: 12px;">
            <option value="review">🌟 정보형/리뷰형 추천 포스팅 (5단계 흐름)</option>
            <option value="comparison">🆚 타사 제품 비교형 포스팅</option>
            <option value="story">✍️ 친근한 실사용 스토리텔링</option>
          </select>
          <button id="btn-generate-blog-run" class="db-modal-btn btn-gradient" style="width: 130px; margin-bottom: 0; padding: 8px;">원고 생성 ✨</button>
        </div>

        <!-- Blog History Selection Container -->
        <div id="blog-history-container" style="display: none; align-items: center; gap: 8px; margin-bottom: 4px; background: #1e1e2f; border: 1px solid #31324f; padding: 6px 10px; border-radius: 8px;">
          <label style="font-size: 11px; font-weight: 700; color: #a5b4fc; white-space: nowrap;">⏰ 이전 생성 원고 이력:</label>
          <select id="blog-history-select" style="flex: 1; padding: 4px 6px; background: #12121e; border: 1px solid #313244; color: #cbd5e1; border-radius: 6px; font-size: 11px;"></select>
        </div>

        <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px;">
          <!-- Title -->
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <label style="font-size: 11px; font-weight: 700; color: #a5b4fc;">생성된 블로그 제목</label>
              <button id="btn-copy-blog-title" class="db-modal-btn btn-purple" style="padding: 3px 8px; font-size: 10px; width: auto; margin-bottom: 0; display: none;">📋 제목 복사</button>
            </div>
            <input type="text" id="blog-result-title" placeholder="생성 완료 시 여기에 제목이 표시됩니다" readonly style="width: 100%; padding: 8px; background: #1e1e2e; border: 1px solid #313244; color: #fff; border-radius: 6px; font-weight: 700; font-size: 13px;">
          </div>
          <!-- Body -->
          <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <label style="font-size: 11px; font-weight: 700; color: #a5b4fc;">생성된 블로그 본문</label>
              <div style="display: flex; gap: 4px;">
                <button id="btn-copy-blog-markdown" class="db-modal-btn btn-purple" style="padding: 3px 8px; font-size: 10px; width: auto; margin-bottom: 0; display: none;">📋 마크다운 복사</button>
                <button id="btn-copy-blog-html" class="db-modal-btn btn-gradient" style="padding: 3px 8px; font-size: 10px; width: auto; margin-bottom: 0; display: none;">✨ 블로그용 복사 (서식 유지)</button>
              </div>
            </div>
            <textarea id="blog-result-body" readonly placeholder="본문 내용이 여기에 생성됩니다..." style="flex: 1; width: 100%; padding: 10px; background: #1e1e2e; border: 1px solid #313244; color: #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 12.5px; line-height: 1.5; resize: none; overflow-y: auto;"></textarea>
          </div>
        </div>
      </div>

      <!-- THREADS VIEW CONTAINER -->
      <div id="container-threads-view" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; display: none;">
        <div style="display: flex; gap: 8px; align-items: center;">
          <label style="font-size: 11px; font-weight: 700; color: #a5b4fc;">스레드 스타일:</label>
          <select id="threads-style-select" style="flex: 1; padding: 8px; background: #1e1e2e; border: 1px solid #313244; color: #fff; border-radius: 6px; font-size: 12px;">
            <option value="hook">🔥 자극적 후킹 (스크롤 스톱형)</option>
            <option value="tip">📊 유용한 정보 & 꿀팁 요약형</option>
            <option value="chat">💬 자취생/자유 일상 썰 수다형</option>
          </select>
          <button id="btn-generate-threads-run" class="db-modal-btn btn-gradient" style="width: 130px; margin-bottom: 0; padding: 8px;">원고 생성 ✨</button>
        </div>

        <!-- Threads History Selection Container -->
        <div id="threads-history-container" style="display: none; align-items: center; gap: 8px; margin-bottom: 4px; background: #1e1e2f; border: 1px solid #31324f; padding: 6px 10px; border-radius: 8px;">
          <label style="font-size: 11px; font-weight: 700; color: #a5b4fc; white-space: nowrap;">⏰ 이전 생성 원고 이력:</label>
          <select id="threads-history-select" style="flex: 1; padding: 4px 6px; background: #12121e; border: 1px solid #313244; color: #cbd5e1; border-radius: 6px; font-size: 11px;"></select>
        </div>

        <div style="flex: 1; min-height: 0; display: flex; gap: 10px;">
          <!-- Left Panel: Main Post -->
          <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <label style="font-size: 11px; font-weight: 700; color: #a5b4fc;">📢 스레드 본문 (노링크 후킹글)</label>
              <button id="btn-copy-threads-main" class="db-modal-btn btn-purple" style="padding: 3px 8px; font-size: 10px; width: auto; margin-bottom: 0; display: none;">📋 본문 복사</button>
            </div>
            <textarea id="threads-result-main" readonly placeholder="스레드 본문 내용이 여기에 생성됩니다..." style="flex: 1; width: 100%; padding: 10px; background: #1e1e2e; border: 1px solid #313244; color: #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 12.5px; line-height: 1.5; resize: none; overflow-y: auto;"></textarea>
          </div>

          <!-- Right Panel: Reply Thread -->
          <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <label style="font-size: 11px; font-weight: 700; color: #a5b4fc;">💬 스레드 댓글/타래 (링크+공정위)</label>
              <button id="btn-copy-threads-reply" class="db-modal-btn btn-gradient" style="padding: 3px 8px; font-size: 10px; width: auto; margin-bottom: 0; display: none;">📋 댓글 복사</button>
            </div>
